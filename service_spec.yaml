spec:
  containers:
    - name: devcontainer
      image: /devcontainer_db/spcs/images/devcontainer:latest
      env:
        HOME: "/home/pixi"
        USER: "pixi"
        WORKSPACE_DIR: "/home/pixi/workspace"
      volumeMounts:
        - name: pixi-home
          mountPath: /home/pixi
      resources:
        requests:
          memory: 2Gi
          cpu: 1000m
        limits:
          memory: 4Gi
          cpu: 2000m
      readinessProbe:
        port: 8080
        path: /api/health
  endpoints:
    - name: api
      port: 8080
      # Internal only — reachable via service functions, not public
    - name: vscode
      port: 3000
      public: true
    - name: terminal
      port: 7681
      public: true
  volumes:
    - name: pixi-home
      source: "@devcontainer_db.spcs.home_stage"
      uid: 1000
      gid: 1000
capabilities:
  securityContext:
    executeAsCaller: true
serviceRoles:
  - name: api_user
    endpoints:
      - api
      - vscode
      - terminal
