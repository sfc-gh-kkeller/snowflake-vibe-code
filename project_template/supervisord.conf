[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[include]
files = /etc/supervisord.d/*.conf

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/tmp/nginx-supervisor.log
stderr_logfile=/tmp/nginx-supervisor-err.log

[program:api-server]
command=python3 /opt/api/server.py
user=pixi
directory=/home/pixi/workspace
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/tmp/api-server.log
stderr_logfile=/tmp/api-server-err.log
environment=HOME="/home/pixi",USER="pixi",PATH="/home/pixi/.pixi/bin:/home/pixi/.local/bin:/usr/local/bin:/usr/bin:/bin"

[program:devserver]
command=/opt/api/devserver-wrapper.sh
user=pixi
directory=/home/pixi/workspace
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/tmp/devserver.log
stderr_logfile=/tmp/devserver-err.log
environment=HOME="/home/pixi",USER="pixi",PORT="4000",PATH="/home/pixi/.pixi/bin:/home/pixi/.local/bin:/usr/local/bin:/usr/bin:/bin",WORKSPACE_DIR="/home/pixi/workspace",API_PORT="9090"

[program:backup]
command=python3 /opt/api/backup.py
user=pixi
directory=/home/pixi
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/tmp/backup.log
stderr_logfile=/tmp/backup-err.log
environment=HOME="/home/pixi",USER="pixi",PATH="/home/pixi/.pixi/bin:/home/pixi/.local/bin:/usr/local/bin:/usr/bin:/bin"
