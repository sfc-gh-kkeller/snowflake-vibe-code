worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;

    # Temp paths writable by pixi user
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Websocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstreams
    upstream apiserver { server 127.0.0.1:9090; }
    upstream vscode    { server 127.0.0.1:3000; }
    upstream terminal  { server 127.0.0.1:7681; }
    upstream devserver { server 127.0.0.1:4000; }

    server {
        listen 8080;
        server_name _;

        # Emit relative redirects so the browser stays on the public https host.
        # With absolute_redirect on (default), nginx builds http://host:8080/...
        # from its own scheme/port, which is unreachable from the internet.
        absolute_redirect off;

        # Orchestrator api-server endpoints (fixed set, routed to port 9090).
        # Everything else under /api/* falls through to the dev server via location /.
        location = /api/health {
            proxy_pass http://apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/exec {
            proxy_pass http://apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/file/ {
            proxy_pass http://apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location = /api/package/install {
            proxy_pass http://apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location = /api/query {
            proxy_pass http://apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/cocoauth/ {
            proxy_pass http://apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # CoCo auth page (captures caller-rights token for CLI/extension)
        location /cocoauth {
            proxy_pass http://apiserver/cocoauth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OpenVSCode Server
        location /vscode/ {
            proxy_pass http://vscode/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_intercept_errors on;
            error_page 502 /devmode-disabled.html;
        }

        # OpenVSCode static assets (served from /stable-{commit}/...)
        location ~ ^/(stable|oss-dev)- {
            proxy_pass http://vscode;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # Web terminal (ttyd) — ttyd runs with -b /terminal so pass full path
        location /terminal/ {
            proxy_pass http://terminal/terminal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_intercept_errors on;
            error_page 502 /devmode-disabled.html;
        }

        # Trailing-slash redirects handled in nginx (relative) so the browser
        # stays on the public https host. Without these, /vscode and /terminal
        # fall through to the dev server, whose absolute redirects point at
        # http://host:8080/... (unreachable from the internet).
        location = /vscode { return 301 /vscode/; }
        location = /terminal { return 301 /terminal/; }

        # User-defined routes — drop .conf files in /etc/nginx/conf.d/
        include /etc/nginx/conf.d/*.conf;

        # Everything else → dev server (React, Next.js, Flask, etc.)
        # App /api/* routes land here since they don't match the explicit
        # orchestrator locations above.
        location / {
            proxy_pass http://devserver;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;

            # Friendly fallback when dev server isn't running
            proxy_intercept_errors on;
            error_page 502 /502.html;
        }

        location = /502.html {
            root /var/www/default;
            internal;
        }

        location = /devmode-disabled.html {
            root /var/www/default;
            internal;
        }
    }
}
