; Dev-mode processes: VSCode, terminal, token-refresh.
; This file is copied to /etc/supervisord.d/ by entrypoint.sh only when dev mode is enabled.

[program:openvscode-server]
command=/opt/openvscode-server/bin/openvscode-server --host 0.0.0.0 --port 3000 --without-connection-token --telemetry-level off
user=pixi
directory=/home/pixi/workspace
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/tmp/openvscode-server.log
stderr_logfile=/tmp/openvscode-server-err.log
environment=HOME="/home/pixi",USER="pixi"

[program:ttyd]
command=/usr/local/bin/ttyd -W -p 7681 -b /terminal /bin/bash -l
user=pixi
directory=/home/pixi
autostart=true
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/tmp/ttyd.log
stderr_logfile=/tmp/ttyd-err.log
environment=HOME="/home/pixi",USER="pixi",TERM="xterm-256color",PATH="/home/pixi/.pixi/bin:/home/pixi/.local/bin:/usr/local/bin:/usr/bin:/bin"

[program:token-refresh]
command=python3 /opt/api/token_refresh.py
user=pixi
directory=/home/pixi
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/tmp/token-refresh.log
stderr_logfile=/tmp/token-refresh-err.log
environment=HOME="/home/pixi",USER="pixi",PATH="/home/pixi/.pixi/bin:/home/pixi/.local/bin:/usr/local/bin:/usr/bin:/bin"
