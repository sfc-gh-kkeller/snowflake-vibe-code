[program:api-server]
command=/home/pixi/.pixi/bin/uvicorn api_server.main:app --host 0.0.0.0 --port 8080
directory=/opt/devcontainer-api
autostart=true
autorestart=true
stdout_logfile=/var/log/api-server.log
stderr_logfile=/var/log/api-server-error.log
user=pixi
environment=HOME="/home/pixi",PATH="/home/pixi/.pixi/bin:/home/pixi/.local/bin:/usr/local/bin:/usr/bin:/bin"
